services:
  server:
    build:
      context: ./server
    ports:
      - "8080:8080"
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: development
      PORT: 8080

  client:
    build:
      context: ./client
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    depends_on:
      - server
    env_file:
      - ./client/.env
    environment:
      CI: "true"
      NODE_ENV: development
      PROXY_TARGET: http://server:8080

volumes:
  server_node_modules:
  client_node_modules: